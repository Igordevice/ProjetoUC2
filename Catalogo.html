<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SinguLar | Escolha seu Profissional</title>

    <!-- Fonte Lexend (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Interligação dos estilos: global primeiro, específico depois -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="catalogo.css">
</head>

<body>

    <!-- Botão Voltar ao Início -->
    <nav class="catalogo-nav-voltar" aria-label="Navegação de retorno">
        <a href="index.html" class="btn-voltar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Voltar ao início</span>
        </a>
    </nav>

    <!-- Início do Conteúdo Principal -->
    <main class="catalogo-container">

        <!-- Início do Cabeçalho da Página -->
        <header class="catalogo-cabecalho">
            <span class="catalogo-badge-topo">TERAPEUTAS</span>
            <h1 class="catalogo-titulo">Escolha seu profissional</h1>
            <p class="catalogo-subtitulo">
                Todos especializados em neurodivergência. Filtre pelo que faz mais sentido para você.
            </p>
        </header>
        <!-- Fim do Cabeçalho da Página -->

        <!-- Início da Barra de Filtros e Busca -->
        <section class="catalogo-controles" aria-label="Filtros de busca de terapeutas">

            <!-- Bloco Esquerdo: Busca, Público e Disponibilidade -->
            <div class="catalogo-filtros-grupo-esquerda">

                <!-- Campo de Busca em Tempo Real -->
                <div class="campo-busca-wrapper">
                    <svg class="icone-busca" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6F84"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="catalogo-busca" placeholder="Buscar por nome ou especialidade..."
                        aria-label="Buscar terapeuta por nome ou especialidade">
                </div>

                <!-- Pílulas de Público Alvo -->
                <div class="grupo-pilulas" id="filtro-publico" role="group" aria-label="Filtrar por público">
                    <button type="button" class="btn-pilula ativa" data-publico="Todos">Todos</button>
                    <button type="button" class="btn-pilula" data-publico="Infantil">Infantil</button>
                    <button type="button" class="btn-pilula" data-publico="Adultos">Adultos</button>
                    <button type="button" class="btn-pilula" data-publico="Adolescente">Adolescente</button>
                </div>

                <!-- Toggle: Disponível Agora -->
                <label class="toggle-disponivel" for="toggle-disponivel-input">
                    <input type="checkbox" id="toggle-disponivel-input">
                    <span class="ponto-status" aria-hidden="true"></span>
                    <span class="rotulo-status">Disponível agora</span>
                </label>

            </div>
            <!-- Fim do Bloco Esquerdo -->

            <!-- Bloco Direito: Modalidade -->
            <div class="catalogo-filtros-grupo-direita">
                <div class="grupo-pilulas" id="filtro-modalidade" role="group" aria-label="Filtrar por modalidade">
                    <button type="button" class="btn-pilula ativa" data-modalidade="Todos">Todos</button>
                    <button type="button" class="btn-pilula" data-modalidade="Online">Online</button>
                    <button type="button" class="btn-pilula" data-modalidade="Presencial">Presencial</button>
                </div>
            </div>
            <!-- Fim do Bloco Direito -->

        </section>
        <!-- Fim da Barra de Filtros e Busca -->

        <!-- Início do Contador de Resultados -->
        <div class="catalogo-info-resultados">
            <span id="contador-profissionais">6</span> profissionais encontrados
        </div>
        <!-- Fim do Contador de Resultados -->

        <!-- Início da Grade de Profissionais -->
        <section id="lista-profissionais" class="catalogo-grade" aria-live="polite"
            aria-label="Lista de profissionais cadastrados">
            <!-- Cards criados via catalogo.js -->
        </section>
        <!-- Fim da Grade de Profissionais -->

    </main>
    <!-- Fim do Conteúdo Principal -->

    <!-- Interligação dos scripts: global primeiro, catálogo dinâmico depois -->
    <script src="script.js"></script>
    <script src="catalogo.js"></script>
</body>

</html>
